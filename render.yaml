# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Creates a Postgres database and one web service (API + app on the same HTTPS URL).
databases:
  - name: navnet-db
    plan: free
    databaseName: navnet
    user: navnet

services:
  - type: web
    name: navnet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: navnet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SIGNUP_CODE
        sync: false # Render asks you for this on the first deploy
      - key: NODE_ENV
        value: production
      # Python analytics service (below). Paste its public URL here after the first deploy,
      # e.g. https://navnet-analytics.onrender.com. Leave empty to run without it.
      - key: ANALYTICS_URL
        sync: false
      - key: ANALYTICS_KEY
        fromService:
          type: web
          name: navnet-analytics
          envVarKey: ANALYTICS_KEY
      # Stream positions to the Python safety monitor (possible crash / weak GPS / unusual movement).
      - key: SAFETY_MONITOR
        value: "1"
      # Optional: n8n / Zapier webhook for SOS + crash alerts (see integrations/n8n). Leave empty to skip.
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        generateValue: true

  # Ride insights + machine-learned ETA (FastAPI, pandas, scikit-learn). Reads the same database.
  - type: web
    name: navnet-analytics
    runtime: python
    plan: free
    rootDir: analytics
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: navnet-db
          property: connectionString
      - key: ANALYTICS_KEY
        generateValue: true
      - key: SAFETY_MONITOR
        value: "1"
      # The NavNet service's public URL (e.g. https://navnet-xxxx.onrender.com), where the safety
      # monitor sends its alerts. Paste it after the first deploy.
      - key: API_URL
        sync: false
